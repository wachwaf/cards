<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cards</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cards">
<meta name="theme-color" content="#0e7490">
<style>
:root{--bg:#e9eef5;--card:#fff;--tx:#11223a;--mut:#5d6b80;--ac:#0e7490;--bd:#d3dce8;--rule:#e0605a;--again:#c53030;--hard:#b45309;--good:#15803d;--easy:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#0c1624;--card:#14233a;--tx:#e6edf7;--mut:#8fa0b8;--ac:#38bdf8;--bd:#25384f;--rule:#f0716b;--again:#dc4b4b;--hard:#d9822b;--good:#2f9e5b;--easy:#3b82f6}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 28px/1.2 ui-serif,Georgia,serif;margin:8px 0 14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
.mut{color:var(--mut)}
.pill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}
.face{position:relative;padding:0;overflow:hidden}
.face:before{content:"";position:absolute;left:0;right:0;top:44px;height:2px;background:var(--rule);opacity:.7}
.big{font:22px/1.4 ui-serif,Georgia,serif;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px;display:flex;align-items:center;justify-content:center;padding:56px 20px 24px}
.ans{border-top:1px dashed var(--bd);min-height:100px;padding:20px;color:var(--ac)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:10px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.grades small{font-weight:400;opacity:.9;font-size:12px}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),j=d=>esc(JSON.stringify(d));
const NEW_LIMIT=20,DAY=864e5,today=()=>new Date().toDateString();
const def=()=>({decks:['My Deck'],cards:[],newDay:'',newCount:0,log:{},dirty:{},tomb:{},uid:'',pulled:0});
let S=def(),view='home',deck=null,q=[],cur=null,shown=false,last='',bq='';
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('cards',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{const db=await idb();return await new Promise(ok=>{const r=db.transaction('kv').objectStore('kv').get('state');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}
async function persist(){try{(await idb()).transaction('kv','readwrite').objectStore('kv').put(S,'state')}catch(e){}}
const save=()=>{persist();if(user)later()};
const roll=()=>{if(S.newDay!==today()){S.newDay=today();S.newCount=0}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function mk(d,f,b){const id=uid();S.cards.push({id,deck:d,f,b,ef:2.5,int:0,reps:0,due:0,lapses:0,upd:Date.now()});S.dirty[id]=1}
function fix(){S.cards.forEach(c=>{if(typeof c.id!=='string')c.id=uid();c.upd=c.upd||Date.now()})}
function counts(d){const n=Date.now(),cs=S.cards.filter(c=>c.deck===d);return{n:Math.min(cs.filter(c=>!c.due).length,Math.max(0,NEW_LIMIT-S.newCount)),d:cs.filter(c=>c.due&&c.due<=n).length}}
function sched(c,g){let ef=c.ef,i=c.int,r=c.reps;
 if(g===0)return{ef:Math.max(1.3,ef-.2),int:0,reps:0,min:1};
 if(g===1){i=r===0?1:Math.max(i+1,Math.round(i*1.2));ef=Math.max(1.3,ef-.15)}
 else if(g===2)i=r===0?1:r===1?3:Math.max(i+1,Math.round(i*ef));
 else{i=r===0?4:Math.max(i+2,Math.round(i*ef*1.3));ef+=.15}
 return{ef,int:i,reps:r+1}}
const label=r=>r.min?'<1m':r.int+'d';
function build(d){roll();const n=Date.now(),cs=S.cards.filter(c=>c.deck===d);
 return[...cs.filter(c=>c.due&&c.due<=n).sort((a,b)=>a.due-b.due),...cs.filter(c=>!c.due).slice(0,Math.max(0,NEW_LIMIT-S.newCount))]}
function study(d){deck=d;q=build(d);next()}
function next(){cur=q.shift()||null;shown=false;view='study';render()}
function reveal(){shown=true;render()}
function grade(g){const c=cur,r=sched(c,g);if(!c.due)S.newCount++;
 Object.assign(c,{ef:r.ef,int:r.int,reps:r.reps,due:Date.now()+(r.min?r.min*6e4:r.int*DAY)});c.upd=Date.now();S.dirty[c.id]=1;
 if(g===0){c.lapses++;q.push(c)}
 S.log[today()]=(S.log[today()]||0)+1;save();next()}
const go=v=>{view=v;render()};
function browse(d){deck=d;bq='';go('browse')}
function newDeck(){const n=$('#nd').value.trim();if(n&&!S.decks.includes(n)){S.decks.push(n);save();render()}}
function addCard(){const f=$('#af').value.trim(),b=$('#ab').value.trim();if(!f||!b){$('#am').textContent='Fill in both sides.';return}
 last=$('#ad').value;mk(last,f,b);save();$('#af').value=$('#ab').value='';$('#af').focus();$('#am').textContent='Added. '+S.cards.length+' cards total.'}
function del(id){if(confirm('Delete this card?')){S.cards=S.cards.filter(c=>c.id!==id);delete S.dirty[id];S.tomb[id]=Date.now();save();$('#bl').innerHTML=bl()}}
const msg=t=>{$('#mm').textContent=t};
async function doImport(){const f=$('#mf').files[0];let t=(f?await f.text():$('#mt').value).trim();if(!t)return msg('Choose a file or paste some cards first.');
 if(t[0]==='{'){try{const o=JSON.parse(t);if(!Array.isArray(o.cards))throw 0;if(!confirm('Replace everything with this backup?'))return;S=Object.assign(def(),o);fix();if(user){S.uid=user.uid;S.pulled=0;S.cards.forEach(c=>{c.upd=Date.now();S.dirty[c.id]=1})}save();return msg('Backup restored: '+S.cards.length+' cards.')}catch(e){return msg('That file is not a valid backup.')}}
 const d=$('#md').value,cl=s=>(s||'').trim().replace(/^"(.*)"$/,'$1');let n=0;
 for(const line of t.split(/\r?\n/)){if(!line.trim()||line[0]==='#')continue;
  const sep=line.includes('\t')?'\t':line.includes(';')?';':',',i=line.indexOf(sep);if(i<0)continue;
  const p=sep==='\t'?line.split('\t'):[line.slice(0,i),line.slice(i+1)],a=cl(p[0]),b=cl(p[1]);if(a&&b){mk(d,a,b);n++}}
 save();msg('Imported '+n+' cards into '+d+'.')}
function exp(k){const t=k==='json'?JSON.stringify(S):S.cards.map(c=>c.f.replace(/\s+/g,' ')+'\t'+c.b.replace(/\s+/g,' ')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='cards-'+new Date().toISOString().slice(0,10)+(k==='json'?'.json':'.txt');a.click()}
const opts=sel=>S.decks.map(d=>`<option ${d===sel?'selected':''}>${esc(d)}</option>`).join('');
const back=`<button class="g" onclick="go('home')">&larr; Back</button>`;
function homeV(){roll();return`<div class="bar"><h1>Cards</h1><div class="row"><button onclick="go('add')">Add</button><button class="g" onclick="go('menu')">Settings</button></div></div>
<p class="mut" style="margin-top:-6px">${S.log[today()]||0} reviewed today, ${S.cards.length} cards in total</p>
${S.decks.map(d=>{const c=counts(d);return`<div class="card"><div class="bar"><b>${esc(d)}</b><span class="mut">${c.n} new, ${c.d} due</span></div>
<div class="row" style="margin-top:12px"><button style="flex:1" ${c.n+c.d?'':'disabled'} onclick="study(${j(d)})">Study</button><button class="g" onclick="browse(${j(d)})">Browse</button></div></div>`}).join('')}
<div class="card"><div class="row"><input id="nd" placeholder="New deck name" style="margin:0"><button class="g" onclick="newDeck()">Create</button></div></div>`}
function studyV(){if(!cur)return`<div class="card" style="text-align:center;padding:40px 16px"><h1>All done</h1><p class="mut">Nothing else is due in ${esc(deck)}. Come back later.</p><button onclick="go('home')">Back to decks</button></div>`;
return`<div class="bar" style="margin-bottom:12px">${back}<span class="mut">${q.length+1} left</span></div>
<div class="card face"><div class="big">${esc(cur.f)}</div>${shown?`<div class="ans big" style="font-size:20px;padding:20px;min-height:90px">${esc(cur.b)}</div>`:''}</div>
${shown?`<div class="grades">${['Again','Hard','Good','Easy'].map((n,i)=>`<button style="background:var(--${n.toLowerCase()})" onclick="grade(${i})">${n}<small>${label(sched(cur,i))}</small></button>`).join('')}</div>`:`<button style="width:100%;padding:14px" onclick="reveal()">Show answer</button>`}`}
const addV=()=>`<div class="bar">${back}</div><h1>Add card</h1><div class="card"><select id="ad">${opts(last)}</select><textarea id="af" placeholder="Front"></textarea><textarea id="ab" placeholder="Back"></textarea><button style="width:100%" onclick="addCard()">Add card</button><p id="am" class="mut" style="margin:8px 0 0"></p></div>`;
const menuV=()=>`<div class="bar">${back}</div><h1>Settings</h1>${acctV()}
<div class="card"><b>Import cards</b><p class="mut" style="margin:4px 0 10px">One card per line, front and back split by a tab (Anki text export), a semicolon or a comma. Or choose a JSON backup to restore.</p>
<select id="md">${opts(last)}</select><textarea id="mt" placeholder="Paste cards here"></textarea><input type="file" id="mf" accept=".txt,.csv,.tsv,.json"><button style="width:100%" onclick="doImport()">Import</button><p id="mm" class="mut" style="margin:8px 0 0"></p></div>
<div class="card"><b>Backup</b><div class="row" style="margin:10px 0"><button class="g" onclick="exp('json')">Export JSON</button><button class="g" onclick="exp('tsv')">Export text</button></div><p class="mut" style="margin:0;font-size:14px">Cards are always saved on this device first. Export a JSON backup now and then; it also restores your progress.</p></div>`;
function bl(){const k=bq.toLowerCase(),all=S.cards.filter(c=>c.deck===deck&&(c.f+' '+c.b).toLowerCase().includes(k));
 return`<p class="mut">${all.length} cards${all.length>100?' (showing 100, search to narrow)':''}</p>`+all.slice(0,100).map(c=>`<div class="card"><div class="bar"><div style="min-width:0;overflow-wrap:anywhere"><b>${esc(c.f)}</b><div class="mut">${esc(c.b)}</div></div><button class="g" onclick="del(${j(c.id)})">Delete</button></div></div>`).join('')}
const browseV=()=>`<div class="bar">${back}</div><h1>${esc(deck)}</h1><input placeholder="Search cards" oninput="bq=this.value;$('#bl').innerHTML=bl()"><div id="bl">${bl()}</div>`;
const SDK='https://www.gstatic.com/firebasejs/10.12.2/',EMBEDDED={apiKey:"AIzaSyA6nvAHOMFpZD8cmlpiaJEEQT_inF-ALrk",authDomain:"studentexcellencecards.firebaseapp.com",projectId:"studentexcellencecards",storageBucket:"studentexcellencecards.firebasestorage.app",messagingSenderId:"814232925114",appId:"1:814232925114:web:7521deae3b4a9a0bb5e383"};
let fb=null,user=null,syncMsg='',syncing=false,timer=null,signup=false,em0='';
function mode(v){em0=($('#ae')||{}).value||'';signup=v;syncMsg='';render()}
const parseCfg=t=>{const o={};for(const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];return o.apiKey&&o.projectId&&o.appId?o:null};
const getCfg=()=>EMBEDDED||parseCfg(localStorage.getItem('fbcfg')||'');
const ui=()=>{const e=$('#sm');if(e)e.textContent=syncMsg},amsg=t=>{syncMsg=t;ui()};
const later=()=>{clearTimeout(timer);timer=setTimeout(sync,3000)};
const tout=p=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Timed out. Will retry.')),30000))]);
const errTxt=e=>({'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'Wrong email or password.','auth/email-already-in-use':'That email already has an account. Try signing in.','auth/weak-password':'Choose a stronger password.','auth/invalid-email':'That email address looks wrong.','auth/network-request-failed':'No internet connection.','auth/too-many-requests':'Too many attempts. Wait a bit and try again.','auth/operation-not-allowed':'Email sign-in is not turned on in Firebase.','auth/unauthorized-domain':'Add this site address to Authorized domains in Firebase.','permission-denied':'Firestore rules are blocking access. Check the rules are published.'}[e.code]||e.code||e.message);
async function initFb(){const cfg=getCfg();if(!cfg||fb)return;
 try{const[a,u,f]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
  const app=a.initializeApp(cfg);fb={u,f,auth:u.getAuth(app),db:f.getFirestore(app)};u.onAuthStateChanged(fb.auth,onUser)}
 catch(e){syncMsg='Cloud sync needs an internet connection to load.'}
 if(view==='menu')render()}
async function onUser(u){user=u;
 if(u){if(S.uid&&S.uid!==u.uid&&S.cards.length&&!confirm('This device has cards from a different account. Add them to this account?')){await fb.u.signOut(fb.auth);return}
  if(S.uid!==u.uid){S.uid=u.uid;S.pulled=0;S.cards.forEach(c=>S.dirty[c.id]=1);persist()}
  syncMsg='';sync()}
 if(view==='menu')render()}
async function sync(){if(!fb||!user||syncing||!navigator.onLine)return;syncing=true;amsg('Syncing...');
 try{const f=fb.f,db=fb.db,col=f.collection(db,'users',user.uid,'cards'),idx=new Map(S.cards.map(c=>[c.id,c])),ops=[],sent={};
  for(const id in S.dirty){const c=idx.get(id);if(c){sent[id]=c.upd;ops.push([id,{deck:c.deck,f:c.f,b:c.b,ef:c.ef,int:c.int,reps:c.reps,due:c.due,lapses:c.lapses||0,upd:c.upd,srv:f.serverTimestamp()}])}}
  for(const id in S.tomb){sent[id]=S.tomb[id];ops.push([id,{del:true,upd:S.tomb[id],srv:f.serverTimestamp()}])}
  for(let i=0;i<ops.length;i+=400){const b=f.writeBatch(db);ops.slice(i,i+400).forEach(([id,d])=>b.set(f.doc(col,id),d));await tout(b.commit());
   ops.slice(i,i+400).forEach(([id])=>{const c=idx.get(id);if(S.tomb[id]===sent[id])delete S.tomb[id];if(c&&c.upd===sent[id])delete S.dirty[id]})}
  const md=f.doc(db,'users',user.uid,'meta','decks'),ds=await tout(f.getDoc(md)),rl=ds.exists()?ds.data().list||[]:[],mg=[...new Set([...rl,...S.decks])];
  if(mg.length!==rl.length)await tout(f.setDoc(md,{list:mg}));S.decks=mg;
  const snap=await tout(f.getDocs(f.query(col,f.where('srv','>',f.Timestamp.fromMillis(S.pulled)),f.orderBy('srv')))),dead=new Set();let n=0,mx=S.pulled;
  snap.forEach(x=>{const d=x.data(),id=x.id,l=idx.get(id);mx=Math.max(mx,d.srv.toMillis());if(l&&l.upd>=d.upd)return;
   if(d.del){if(l)dead.add(id);return}
   const c={id,deck:d.deck,f:d.f,b:d.b,ef:d.ef,int:d.int,reps:d.reps,due:d.due,lapses:d.lapses||0,upd:d.upd};
   if(l)Object.assign(l,c);else{S.cards.push(c);idx.set(id,c)}n++});
  if(dead.size)S.cards=S.cards.filter(c=>!dead.has(c.id));
  S.pulled=mx;await persist();syncMsg='Synced at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+(n?', '+n+' updated from the cloud':'');
  if(n&&view==='home')render()}
 catch(e){syncMsg='Sync failed: '+errTxt(e)}
 syncing=false;ui()}
async function auth(k){const e=$('#ae').value.trim(),p=$('#ap').value;if(!e||!p)return amsg('Enter your email and password.');if(k==='up'&&p.length<8)return amsg('Use at least 8 characters.');if(k==='up'&&p!==$('#ap2').value)return amsg('The two passwords do not match.');
 amsg('Working...');try{await(k==='up'?fb.u.createUserWithEmailAndPassword:fb.u.signInWithEmailAndPassword)(fb.auth,e,p)}catch(x){amsg(errTxt(x))}}
async function resetPw(){const e=$('#ae').value.trim();if(!e)return amsg('Type your email first.');try{await fb.u.sendPasswordResetEmail(fb.auth,e);amsg('Reset email sent. Check your inbox.')}catch(x){amsg(errTxt(x))}}
function saveCfg(){if(!parseCfg($('#cf').value))return amsg('Could not read that. Paste the whole firebaseConfig block.');localStorage.setItem('fbcfg',$('#cf').value);syncMsg='';initFb().then(render)}
function acctV(){const h=b=>`<div class="card"><b>Cloud sync</b>${b}<p id="sm" class="mut" style="margin:8px 0 0">${esc(syncMsg)}</p></div>`;
 if(!getCfg())return h(`<p class="mut" style="margin:4px 0 10px">Sync your cards across devices with a free Firebase project. Paste the firebaseConfig block from your project settings.</p><textarea id="cf" placeholder='const firebaseConfig = { apiKey: "...", ... };'></textarea><button style="width:100%" onclick="saveCfg()">Save and continue</button>`);
 if(!fb)return h(`<p class="mut" style="margin:4px 0 0">Loading sync. This needs an internet connection.</p>`);
 if(!user)return h(`<input id="ae" type="email" placeholder="Email" autocomplete="email" value="${esc(em0)}"><input id="ap" type="password" placeholder="Password (8+ characters)" autocomplete="${signup?'new-password':'current-password'}">${signup?'<input id="ap2" type="password" placeholder="Re-enter password" autocomplete="new-password">':''}<button style="width:100%" onclick="auth('${signup?'up':'in'}')">${signup?'Create account':'Sign in'}</button><p style="margin:10px 0 0"><a href="#" onclick="mode(${!signup});return false" style="color:var(--ac)">${signup?'Have an account? Sign in':'New here? Create an account'}</a>${signup?'':' &middot; <a href="#" onclick="resetPw();return false" style="color:var(--ac)">Forgot password?</a>'}</p>`);
 return h(`<p style="margin:4px 0 10px">Signed in as <b>${esc(user.email)}</b></p><div class="row"><button style="flex:1" onclick="sync()">Sync now</button><button class="g" onclick="fb.u.signOut(fb.auth)">Sign out</button></div>`)}
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(user)sync()});
function render(){$('#app').innerHTML={home:homeV,study:studyV,add:addV,menu:menuV,browse:browseV}[view]();scrollTo(0,0)}
addEventListener('keydown',e=>{if(view!=='study'||!cur||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(!shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal()}else if(shown&&e.key.length===1&&'1234'.includes(e.key))grade(+e.key-1)});
(async()=>{const s=await load();S=Object.assign(def(),s||{});fix();render();initFb();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
