<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cards</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cards">
<meta name="theme-color" content="#0e7490">
<style>
:root{--bg:#e9eef5;--card:#fff;--tx:#11223a;--mut:#5d6b80;--ac:#0e7490;--bd:#d3dce8;--rule:#e0605a;--again:#c53030;--hard:#b45309;--good:#15803d;--easy:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#0c1624;--card:#14233a;--tx:#e6edf7;--mut:#8fa0b8;--ac:#38bdf8;--bd:#25384f;--rule:#f0716b;--again:#dc4b4b;--hard:#d9822b;--good:#2f9e5b;--easy:#3b82f6}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 28px/1.2 ui-serif,Georgia,serif;margin:8px 0 14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
.mut{color:var(--mut)}
.pill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}
.face{position:relative;padding:0;overflow:hidden}
.face:before{content:"";position:absolute;left:0;right:0;top:44px;height:2px;background:var(--rule);opacity:.7}
.big{font:22px/1.4 ui-serif,Georgia,serif;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px;display:flex;align-items:center;justify-content:center;padding:56px 20px 24px}
.ans{border-top:1px dashed var(--bd);min-height:100px;padding:20px;color:var(--ac)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:10px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.grades small{font-weight:400;opacity:.9;font-size:12px}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),j=d=>esc(JSON.stringify(d));
const NEW_LIMIT=20,DAY=864e5,today=()=>new Date().toDateString();
const def=()=>({decks:['My Deck'],cards:[],newDay:'',newCount:0,log:{},nid:0});
let S=def(),view='home',deck=null,q=[],cur=null,shown=false,last='',bq='';
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('cards',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{const db=await idb();return await new Promise(ok=>{const r=db.transaction('kv').objectStore('kv').get('state');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}
async function save(){try{(await idb()).transaction('kv','readwrite').objectStore('kv').put(S,'state')}catch(e){}}
const roll=()=>{if(S.newDay!==today()){S.newDay=today();S.newCount=0}};
const mk=(d,f,b)=>S.cards.push({id:++S.nid,deck:d,f,b,ef:2.5,int:0,reps:0,due:0,lapses:0});
function counts(d){const n=Date.now(),cs=S.cards.filter(c=>c.deck===d);return{n:Math.min(cs.filter(c=>!c.due).length,Math.max(0,NEW_LIMIT-S.newCount)),d:cs.filter(c=>c.due&&c.due<=n).length}}
function sched(c,g){let ef=c.ef,i=c.int,r=c.reps;
 if(g===0)return{ef:Math.max(1.3,ef-.2),int:0,reps:0,min:1};
 if(g===1){i=r===0?1:Math.max(i+1,Math.round(i*1.2));ef=Math.max(1.3,ef-.15)}
 else if(g===2)i=r===0?1:r===1?3:Math.max(i+1,Math.round(i*ef));
 else{i=r===0?4:Math.max(i+2,Math.round(i*ef*1.3));ef+=.15}
 return{ef,int:i,reps:r+1}}
const label=r=>r.min?'<1m':r.int+'d';
function build(d){roll();const n=Date.now(),cs=S.cards.filter(c=>c.deck===d);
 return[...cs.filter(c=>c.due&&c.due<=n).sort((a,b)=>a.due-b.due),...cs.filter(c=>!c.due).slice(0,Math.max(0,NEW_LIMIT-S.newCount))]}
function study(d){deck=d;q=build(d);next()}
function next(){cur=q.shift()||null;shown=false;view='study';render()}
function reveal(){shown=true;render()}
function grade(g){const c=cur,r=sched(c,g);if(!c.due)S.newCount++;
 Object.assign(c,{ef:r.ef,int:r.int,reps:r.reps,due:Date.now()+(r.min?r.min*6e4:r.int*DAY)});
 if(g===0){c.lapses++;q.push(c)}
 S.log[today()]=(S.log[today()]||0)+1;save();next()}
const go=v=>{view=v;render()};
function browse(d){deck=d;bq='';go('browse')}
function newDeck(){const n=$('#nd').value.trim();if(n&&!S.decks.includes(n)){S.decks.push(n);save();render()}}
function addCard(){const f=$('#af').value.trim(),b=$('#ab').value.trim();if(!f||!b){$('#am').textContent='Fill in both sides.';return}
 last=$('#ad').value;mk(last,f,b);save();$('#af').value=$('#ab').value='';$('#af').focus();$('#am').textContent='Added. '+S.cards.length+' cards total.'}
function del(id){if(confirm('Delete this card?')){S.cards=S.cards.filter(c=>c.id!==id);save();$('#bl').innerHTML=bl()}}
const msg=t=>{$('#mm').textContent=t};
async function doImport(){const f=$('#mf').files[0];let t=(f?await f.text():$('#mt').value).trim();if(!t)return msg('Choose a file or paste some cards first.');
 if(t[0]==='{'){try{const o=JSON.parse(t);if(!Array.isArray(o.cards))throw 0;if(!confirm('Replace everything with this backup?'))return;S=Object.assign(def(),o);save();return msg('Backup restored: '+S.cards.length+' cards.')}catch(e){return msg('That file is not a valid backup.')}}
 const d=$('#md').value,cl=s=>(s||'').trim().replace(/^"(.*)"$/,'$1');let n=0;
 for(const line of t.split(/\r?\n/)){if(!line.trim()||line[0]==='#')continue;
  const sep=line.includes('\t')?'\t':line.includes(';')?';':',',i=line.indexOf(sep);if(i<0)continue;
  const p=sep==='\t'?line.split('\t'):[line.slice(0,i),line.slice(i+1)],a=cl(p[0]),b=cl(p[1]);if(a&&b){mk(d,a,b);n++}}
 save();msg('Imported '+n+' cards into '+d+'.')}
function exp(k){const t=k==='json'?JSON.stringify(S):S.cards.map(c=>c.f.replace(/\s+/g,' ')+'\t'+c.b.replace(/\s+/g,' ')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='cards-'+new Date().toISOString().slice(0,10)+(k==='json'?'.json':'.txt');a.click()}
const opts=sel=>S.decks.map(d=>`<option ${d===sel?'selected':''}>${esc(d)}</option>`).join('');
const back=`<button class="g" onclick="go('home')">&larr; Back</button>`;
function homeV(){roll();return`<div class="bar"><h1>Cards</h1><div class="row"><button onclick="go('add')">Add</button><button class="g" onclick="go('menu')">Import &amp; backup</button></div></div>
<p class="mut" style="margin-top:-6px">${S.log[today()]||0} reviewed today, ${S.cards.length} cards in total</p>
${S.decks.map(d=>{const c=counts(d);return`<div class="card"><div class="bar"><b>${esc(d)}</b><span class="mut">${c.n} new, ${c.d} due</span></div>
<div class="row" style="margin-top:12px"><button style="flex:1" ${c.n+c.d?'':'disabled'} onclick="study(${j(d)})">Study</button><button class="g" onclick="browse(${j(d)})">Browse</button></div></div>`}).join('')}
<div class="card"><div class="row"><input id="nd" placeholder="New deck name" style="margin:0"><button class="g" onclick="newDeck()">Create</button></div></div>`}
function studyV(){if(!cur)return`<div class="card" style="text-align:center;padding:40px 16px"><h1>All done</h1><p class="mut">Nothing else is due in ${esc(deck)}. Come back later.</p><button onclick="go('home')">Back to decks</button></div>`;
return`<div class="bar" style="margin-bottom:12px">${back}<span class="mut">${q.length+1} left</span></div>
<div class="card face"><div class="big">${esc(cur.f)}</div>${shown?`<div class="ans big" style="font-size:20px;padding:20px;min-height:90px">${esc(cur.b)}</div>`:''}</div>
${shown?`<div class="grades">${['Again','Hard','Good','Easy'].map((n,i)=>`<button style="background:var(--${n.toLowerCase()})" onclick="grade(${i})">${n}<small>${label(sched(cur,i))}</small></button>`).join('')}</div>`:`<button style="width:100%;padding:14px" onclick="reveal()">Show answer</button>`}`}
const addV=()=>`<div class="bar">${back}</div><h1>Add card</h1><div class="card"><select id="ad">${opts(last)}</select><textarea id="af" placeholder="Front"></textarea><textarea id="ab" placeholder="Back"></textarea><button style="width:100%" onclick="addCard()">Add card</button><p id="am" class="mut" style="margin:8px 0 0"></p></div>`;
const menuV=()=>`<div class="bar">${back}</div><h1>Import &amp; backup</h1>
<div class="card"><b>Import cards</b><p class="mut" style="margin:4px 0 10px">One card per line, front and back split by a tab (Anki text export), a semicolon or a comma. Or choose a JSON backup to restore.</p>
<select id="md">${opts(last)}</select><textarea id="mt" placeholder="Paste cards here"></textarea><input type="file" id="mf" accept=".txt,.csv,.tsv,.json"><button style="width:100%" onclick="doImport()">Import</button><p id="mm" class="mut" style="margin:8px 0 0"></p></div>
<div class="card"><b>Backup</b><div class="row" style="margin:10px 0"><button class="g" onclick="exp('json')">Export JSON</button><button class="g" onclick="exp('tsv')">Export text</button></div><p class="mut" style="margin:0;font-size:14px">Your cards are stored only on this device. Export a JSON backup now and then; it also restores your progress.</p></div>`;
function bl(){const k=bq.toLowerCase(),all=S.cards.filter(c=>c.deck===deck&&(c.f+' '+c.b).toLowerCase().includes(k));
 return`<p class="mut">${all.length} cards${all.length>100?' (showing 100, search to narrow)':''}</p>`+all.slice(0,100).map(c=>`<div class="card"><div class="bar"><div style="min-width:0;overflow-wrap:anywhere"><b>${esc(c.f)}</b><div class="mut">${esc(c.b)}</div></div><button class="g" onclick="del(${c.id})">Delete</button></div></div>`).join('')}
const browseV=()=>`<div class="bar">${back}</div><h1>${esc(deck)}</h1><input placeholder="Search cards" oninput="bq=this.value;$('#bl').innerHTML=bl()"><div id="bl">${bl()}</div>`;
function render(){$('#app').innerHTML={home:homeV,study:studyV,add:addV,menu:menuV,browse:browseV}[view]();scrollTo(0,0)}
addEventListener('keydown',e=>{if(view!=='study'||!cur||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(!shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal()}else if(shown&&e.key.length===1&&'1234'.includes(e.key))grade(+e.key-1)});
(async()=>{const s=await load();S=Object.assign(def(),s||{});render();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
